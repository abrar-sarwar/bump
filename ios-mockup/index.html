<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUMP iOS Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- Material Symbols: a SUBSET. A new icon must be added to icon_names,
       alphabetically, or it renders as its name in text. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&icon_names=account_circle,add,arrow_back,arrow_back_ios_new,arrow_forward,auto_awesome,bookmark,chat_bubble,check,chevron_right,close,cloud,edit,expand_more,flag,graphic_eq,group,how_to_reg,info,join_inner,lock,mic,more_vert,near_me,person_search,photo_camera,radar,refresh,sensors_off,settings,stop,travel_explore,vibration,work&display=block" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="interest-themes.css">
  <link rel="stylesheet" href="ios-chrome.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-mode="flow">
  <aside class="side">
    <div class="side__head">
      <div class="side__title">BUMP <span>iOS mockup</span></div>
      <p>HTML stand-in for the SwiftUI app. Design here, approve, then port to Swift. See README.md.</p>
    </div>
    <ul class="nav-list"></ul>
    <a class="theme-lab-link" href="interest-themes.html">Explore interest themes ↗</a>
  </aside>

  <main class="main">
    <header class="bar">
      <div class="seg" role="group" aria-label="View">
        <button data-mode="flow" aria-pressed="true">Prototype</button>
        <button data-mode="grid" aria-pressed="false">All screens</button>
      </div>
      <label>Chrome
        <select id="chrome">
          <option value="bump">BUMP (site)</option>
          <option value="md3">Material 3</option>
          <option value="ios26">iOS 26 (Liquid Glass)</option>
          <option value="ios18">iOS 17/18 (flat)</option>
        </select>
      </label>
      <label class="flow-only">Zoom
        <select id="zoom">
          <option value="fit">Fit</option>
          <option value="1">100%</option>
          <option value="0.75">75%</option>
          <option value="0.5">50%</option>
        </select>
      </label>
    </header>
    <div id="stage" class="stage"></div>
  </main>

  <script src="shapes.js"></script>
  <script src="interest-themes.js"></script>
  <script src="ui.js"></script>
  <script src="screens.js"></script>
  <script src="app.js"></script>
</body>
</html>
